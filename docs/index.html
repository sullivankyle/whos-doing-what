<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Who's Doing What</title>
<meta name="description" content="Keep track of what your friends told you they're doing. No new calendar events. Your data stays on your device.">
<meta name="theme-color" content="#EEEDE3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Who's Doing What">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --ink:#22261F;
    --ink-soft:#63685A;
    --paper:#EEEDE3;
    --paper-raised:#F7F6EF;
    --line:#D8D6C7;
    --coral:#E2542D;
    --coral-soft:#F6D9CD;
    --teal:#2F6E62;
    --teal-soft:#D9E6E1;
    --gold:#C0912E;
    --gold-soft:#F1E3C2;
    --plum:#6A4E63;
    --plum-soft:#E5DAE2;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  /* App-like behavior: no pinch/double-tap zoom, no text-size jumps. */
  html{
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:32px 24px 64px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:6px;
    flex-wrap:wrap;
    gap:8px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:32px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .tagline{
    font-size:13px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
  }
  .layout{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:28px;
    margin-top:28px;
  }
  @media (max-width:720px){
    .layout{grid-template-columns:1fr;}
  }

  /* ---- Roster (sidebar) ---- */
  .roster-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    margin:0 0 10px 2px;
  }
  .roster{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .nametag{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:3px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:1px 2px 0 rgba(34,38,31,0.05);
    user-select:none;
  }
  .nametag:hover{transform:translateY(-1px);}
  .nametag.active{
    background:var(--ink);
    color:var(--paper-raised);
    border-color:var(--ink);
  }
  .dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
  }
  .nametag-name{
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .nametag-edit-input{
    flex:1;
    min-width:0;
    border:1px solid var(--ink);
    border-radius:3px;
    padding:2px 5px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    background:var(--paper-raised);
    color:var(--ink);
  }
  .nametag .edit, .nametag .hide, .nametag .unhide{
    opacity:0;
    font-size:12px;
    color:var(--ink-soft);
    transition:opacity .12s ease;
    flex:0 0 auto;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
  }
  .nametag .hide svg, .nametag .unhide svg{
    display:block;
  }
  .nametag:hover .edit, .nametag:hover .hide{opacity:.7;}
  .nametag.active .edit, .nametag.active .hide{color:var(--paper-raised);}
  .nametag.editing .edit, .nametag.editing .hide{opacity:0; pointer-events:none;}
  .nametag.hidden-friend{ opacity:.75; }
  .nametag.hidden-friend .unhide{ opacity:.7; }
  .nametag.hidden-friend:hover .unhide{ opacity:1; }

  .roster-title-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    user-select:none;
  }
  .roster-title-toggle .roster-title{
    margin:0;
  }
  .roster-title-toggle .section-chevron{
    font-size:11px;
    color:var(--ink-soft);
    width:11px;
    display:inline-block;
  }

  .add-person{
    display:flex;
    gap:6px;
    margin-top:12px;
  }
  .add-person input{
    flex:1;
    min-width:0;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    background:var(--paper-raised);
  }
  .add-person button{
    border:none;
    background:var(--ink);
    color:var(--paper-raised);
    border-radius:3px;
    padding:0 12px;
    font-size:15px;
    cursor:pointer;
  }
  .filter-hint{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:10px;
    line-height:1.5;
  }
  .friend-warning{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--coral);
    font-weight:600;
    margin-top:6px;
    min-height:14px;
  }
  .clear-filter{
    display:inline;
    text-decoration:underline;
    cursor:pointer;
  }

  /* ---- Data tools (export/import) ---- */
  .data-tools{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .data-tools button{
    flex:1;
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    padding:7px 8px;
    border-radius:4px;
    cursor:pointer;
  }
  .data-tools button:hover{
    border-color:var(--ink);
  }
  .data-status{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:8px;
    min-height:14px;
  }
  .sync-line{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:6px;
    word-break:break-all;
  }
  .data-status.ok{color:var(--teal);}
  .data-status.err{color:var(--coral);}

  /* ---- Quick add ---- */
  .composer{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    box-shadow:2px 3px 0 rgba(34,38,31,0.06);
  }
  .composer-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:12px;
  }
  .pick-chip{
    padding:5px 11px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .pick-chip.selected{
    background:var(--ink);
    color:var(--paper-raised);
    border-color:var(--ink);
  }
  .empty-roster-note{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .composer textarea{
    width:100%;
    resize:none;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:6px 2px 12px;
    outline:none;
  }
  .composer-text-wrap{
    position:relative;
  }
  .mention-dropdown{
    display:none;
    position:absolute;
    top:100%;
    left:0;
    right:0;
    margin-top:2px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:2px 4px 10px rgba(34,38,31,0.14);
    z-index:30;
    overflow:hidden;
    max-height:180px;
    overflow-y:auto;
  }
  .mention-dropdown.open{
    display:block;
  }
  .mention-item{
    padding:7px 10px;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:7px;
    cursor:pointer;
  }
  .mention-item:hover, .mention-item.highlighted{
    background:var(--teal-soft);
  }
  .composer-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:12px;
  }
  .composer-status{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
    opacity:0;
    transition:opacity .15s ease;
  }
  .composer-status.warn{ color:var(--coral); opacity:1; }
  .composer-status.ok{ color:var(--teal); opacity:1; }
  .cancel-edit-link{
    text-decoration:underline;
    cursor:pointer;
    font-weight:600;
    color:var(--coral);
    text-transform:none;
    letter-spacing:0;
  }

  /* ---- Date picker ---- */
  .date-picker{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin:2px 0 12px;
    padding:10px 12px;
    background:var(--plum-soft);
    border-radius:6px;
  }
  .quick-chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .quick-chip{
    padding:4px 10px;
    border-radius:14px;
    border:1px solid var(--plum);
    background:var(--paper-raised);
    color:var(--plum);
    font-size:11.5px;
    font-family:'IBM Plex Mono',monospace;
    cursor:pointer;
  }
  .quick-chip:hover{
    background:var(--plum);
    color:#fff;
  }
  .date-mode-row{
    display:flex;
    gap:6px;
  }
  .date-mode-btn{
    padding:4px 10px;
    border-radius:14px;
    border:1px solid var(--plum);
    background:transparent;
    color:var(--plum);
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    cursor:pointer;
  }
  .date-mode-btn.selected{
    background:var(--plum);
    color:#fff;
  }
  .date-input-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .date-input-row input[type="date"]{
    border:1px solid var(--line);
    border-radius:4px;
    padding:6px 8px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    background:var(--paper-raised);
    color:var(--ink);
  }
  .date-input-row .to-label{
    font-size:12px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
  }
  .card-date{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--plum);
    margin:-2px 0 6px;
  }

  .add-entry-btn{
    border:none;
    background:var(--ink);
    color:var(--paper-raised);
    padding:9px 18px;
    border-radius:6px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .add-entry-btn:disabled{
    opacity:.4;
    cursor:default;
  }

  /* ---- Section headers (collapsible) ---- */
  .section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    margin-top:30px;
    margin-bottom:10px;
    user-select:none;
  }
  .section-header-left{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-chevron{
    font-size:12px;
    color:var(--ink-soft);
    width:14px;
    display:inline-block;
  }
  .section-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
  }
  .section-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  /* ---- Kanban ---- */
  .kanban-search-row{
    position:relative;
    margin-bottom:10px;
  }
  .kanban-search-row input{
    width:100%;
    padding:8px 32px 8px 12px;
    border:1px solid var(--line);
    border-radius:20px;
    background:var(--paper-raised);
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--ink);
    outline:none;
  }
  .kanban-search-row input:focus{
    border-color:var(--teal);
  }
  .kanban-search-clear{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    font-size:12px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .kanban-search-clear:hover{
    color:var(--ink);
  }
  .kanban-scroll{
    max-height:520px;
    overflow-y:auto;
    padding-right:4px;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .kanban-row{
    padding:12px 2px;
    border-bottom:1px dashed var(--line);
  }
  .kanban-row:last-child{ border-bottom:none; }
  .kanban-row-label{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:#fff;
    background:var(--teal);
    padding:3px 10px 4px;
    border-radius:2px;
    margin-bottom:8px;
  }
  .kanban-row:nth-child(5n+1) .kanban-row-label{background:var(--coral);}
  .kanban-row:nth-child(5n+2) .kanban-row-label{background:var(--teal);}
  .kanban-row:nth-child(5n+3) .kanban-row-label{background:var(--gold); color:#3a2c05;}
  .kanban-row:nth-child(5n+4) .kanban-row-label{background:var(--plum);}
  .kanban-row:nth-child(5n+5) .kanban-row-label{background:#4A6478;}
  .kanban-row-cards{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
  }
  .kanban-row-cards .card{
    width:230px;
    flex:0 0 auto;
  }
  .kanban-sentinel{
    height:1px;
  }

  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:4px;
    padding:11px 12px;
    box-shadow:1px 2px 0 rgba(34,38,31,0.05);
    position:relative;
    cursor:pointer;
    transition:box-shadow .12s ease;
  }
  .card:hover{
    box-shadow:2px 3px 0 rgba(34,38,31,0.1);
  }
  .card-people{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    margin-bottom:5px;
  }
  .mini-tag{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .card-text{
    font-size:14px;
    line-height:1.4;
    margin:0 0 8px;
  }
  .card-actions{
    display:flex;
    gap:12px;
    font-size:11.5px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink-soft);
  }
  .card-actions span{
    cursor:pointer;
  }
  .card-actions span:hover{
    color:var(--ink);
    text-decoration:underline;
  }
  .empty-col{
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
    padding:2px;
  }

  /* ---- Calendar ---- */
  .calendar-body{
    padding-top:2px;
  }
  .calendar-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:10px;
  }
  .calendar-nav{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .cal-nav-btn{
    width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--paper-raised);
    cursor:pointer;
    font-size:15px;
    user-select:none;
  }
  .cal-nav-btn:hover{border-color:var(--ink);}
  .cal-label{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16px;
    min-width:150px;
    text-align:center;
  }
  .cal-today-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
  }
  .view-toggle{
    display:flex;
    gap:4px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:20px;
    padding:2px;
  }
  .view-toggle-btn{
    padding:5px 14px;
    border-radius:16px;
    font-size:12.5px;
    font-family:'IBM Plex Mono',monospace;
    cursor:pointer;
  }
  .view-toggle-btn.selected{
    background:var(--ink);
    color:var(--paper-raised);
  }
  .cal-daynames{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:2px;
  }
  .cal-dayname{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
    text-align:center;
    padding-bottom:4px;
  }
  .cal-week-row{
    border-bottom:1px solid var(--line);
    padding:6px 0 8px;
  }
  .cal-week-row:last-child{ border-bottom:none; }
  .cal-daynums{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:4px;
  }
  .cal-daynum-cell{
    text-align:center;
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink-soft);
  }
  .cal-daynum-cell.today{
    color:var(--coral);
    font-weight:700;
  }
  .cal-daynum-cell.other-month{
    opacity:.35;
  }
  .cal-bars{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:3px;
  }
  .cal-bar{
    background:var(--teal-soft);
    border-radius:3px;
    padding:1px 6px;
    display:flex;
    align-items:center;
    gap:4px;
    overflow:hidden;
    cursor:pointer;
    height:19px;
  }
  .cal-bar:hover{
    background:var(--gold-soft);
  }
  .cal-bar-dots{
    display:flex;
    gap:2px;
    flex:0 0 auto;
  }
  .cal-bar-text{
    font-size:10.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cal-more{
    font-size:10px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    margin-top:2px;
  }

  /* ---- Done section ---- */
  .done-section{
    margin-top:34px;
    border-top:1px dashed var(--line);
    padding-top:14px;
  }
  .done-toggle{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  .done-list{
    margin-top:10px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .done-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    color:var(--ink-soft);
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:4px;
    padding:7px 10px;
    cursor:pointer;
  }
  .done-card .txt{text-decoration:line-through;}
  .done-card .acts{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    display:flex;
    gap:10px;
  }
  .done-card .acts span{cursor:pointer;}
  .done-card .acts span:hover{color:var(--ink);}

  .loading{
    padding:40px 0;
    text-align:center;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  .app-footer{
    margin-top:36px;
    padding-top:14px;
    border-top:1px solid var(--line);
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    opacity:.7;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Who's Doing What</h1>
    <div class="tagline">no new calendar events. just what they told you.</div>
  </header>

  <div id="app" class="loading">loading board…</div>

  <div class="app-footer">Who's Doing What · v1.8.1 · Last updated Nov 8, 2026</div>
</div>

<script>
const STORAGE_KEY = 'friend-tracker-state-v1';
const COLORS = [
  {name:'coral', hex:'#E2542D'},
  {name:'teal', hex:'#2F6E62'},
  {name:'gold', hex:'#C0912E'},
  {name:'plum', hex:'#6A4E63'},
  {name:'steel', hex:'#4A6478'},

/* ---------------- date helpers ---------------- */

function todayISO(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function parseISO(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d);
}

function isoFromDateObj(dt){
  const pad = n => String(n).padStart(2,'0');
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}

function addDaysISO(iso, n){
  const dt = parseISO(iso);
  dt.setDate(dt.getDate() + n);
  return isoFromDateObj(dt);
}

function formatMD(iso){
  const [, m, d] = iso.split('-').map(Number);
  return `${m}/${d}`;
}

function formatISODateLong(iso){
  if(!iso) return '';
  const dt = parseISO(iso);
  return dt.toLocaleDateString(undefined, { month:'short', day:'numeric', year: (dt.getFullYear() !== new Date().getFullYear()) ? 'numeric' : undefined });
}

function formatDateRange(start, end){
  if(!start) return '';
  if(end && end !== start){
    return `${formatISODateLong(start)} – ${formatISODateLong(end)}`;
  }
  return formatISODateLong(start);
}

function mondayOfWeekContaining(dateObj){
  const dow = dateObj.getDay(); // 0=Sun..6=Sat
  const daysSinceMonday = (dow + 6) % 7;
  const d = new Date(dateObj);
  d.setDate(d.getDate() - daysSinceMonday);
  return d;
}

function mondayOfWeekISO(iso){
  return isoFromDateObj(mondayOfWeekContaining(parseISO(iso)));
}

calendarAnchor = todayISO();

/* ---------------- quick-select periods (composer) ---------------- */

function getQuickPeriods(){
  const thisMondayISO = isoFromDateObj(mondayOfWeekContaining(new Date()));
  const thisSaturdayISO = addDaysISO(thisMondayISO, 5);
  const nextMondayISO = addDaysISO(thisMondayISO, 7);
  const nextSaturdayISO = addDaysISO(thisSaturdayISO, 7);
  return [
    { label: `This week ${formatMD(thisMondayISO)}`, mode:'range', start: thisMondayISO, end: addDaysISO(thisMondayISO, 4) },
    { label: `This weekend ${formatMD(thisSaturdayISO)}`, mode:'range', start: thisSaturdayISO, end: addDaysISO(thisSaturdayISO, 1) },
    { label: `Next week ${formatMD(nextMondayISO)}`, mode:'range', start: nextMondayISO, end: addDaysISO(nextMondayISO, 4) },
    { label: `Next weekend ${formatMD(nextSaturdayISO)}`, mode:'range', start: nextSaturdayISO, end: addDaysISO(nextSaturdayISO, 1) },
  ];
}

/* ---------------- kanban periods ---------------- */

function generateKanbanPeriods(count){
  const thisMondayISO = isoFromDateObj(mondayOfWeekContaining(new Date()));
  const thisSaturdayISO = addDaysISO(thisMondayISO, 5);
  const nextMondayISO = addDaysISO(thisMondayISO, 7);
  const nextSaturdayISO = addDaysISO(thisSaturdayISO, 7);

  const periods = [
    { label: 'Today', start: todayISO(), end: todayISO() },
    { label: `This week ${formatMD(thisMondayISO)}`, start: thisMondayISO, end: addDaysISO(thisMondayISO, 4) },
    { label: `This weekend ${formatMD(thisSaturdayISO)}`, start: thisSaturdayISO, end: addDaysISO(thisSaturdayISO, 1) },
    { label: `Next week ${formatMD(nextMondayISO)}`, start: nextMondayISO, end: addDaysISO(nextMondayISO, 4) },
    { label: `Next weekend ${formatMD(nextSaturdayISO)}`, start: nextSaturdayISO, end: addDaysISO(nextSaturdayISO, 1) },
  ];

  let weekMondayISO = addDaysISO(nextMondayISO, 7);
  let weekendSaturdayISO = addDaysISO(nextSaturdayISO, 7);
  let idx = 0;
  while(periods.length < count){
    if(idx % 2 === 0){
      periods.push({ label: `${formatMD(weekMondayISO)} week`, start: weekMondayISO, end: addDaysISO(weekMondayISO, 4) });
      weekMondayISO = addDaysISO(weekMondayISO, 7);
    } else {
      periods.push({ label: `${formatMD(weekendSaturdayISO)} weekend`, start: weekendSaturdayISO, end: addDaysISO(weekendSaturdayISO, 1) });
      weekendSaturdayISO = addDaysISO(weekendSaturdayISO, 7);
    }
    idx++;
  }
  return periods;
}

/* ---------------- calendar week-row layout ---------------- */

function computeWeekLayout(weekStartIso, entries, maxLanes){
  const weekStart = parseISO(weekStartIso);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 6);

  const touching = entries.filter(e => {
    const s = parseISO(e.start), en = parseISO(e.end || e.start);
    return en >= weekStart && s <= weekEnd;
  }).map(e => {
    const s = parseISO(e.start), en = parseISO(e.end || e.start);
    const startIdx = Math.max(0, Math.round((s - weekStart) / 86400000));
    const endIdx = Math.min(6, Math.round((en - weekStart) / 86400000));
    return { entry: e, startIdx, endIdx };
  }).sort((a,b) => a.startIdx - b.startIdx || (b.endIdx - b.startIdx) - (a.endIdx - a.startIdx));

  const lanes = [];
  const placed = [];
  let overflow = 0;
  touching.forEach(item => {
    let laneIdx = lanes.findIndex(lane => lane.every(seg => item.startIdx > seg.endIdx || item.endIdx < seg.startIdx));
    if(laneIdx === -1){
      if(lanes.length >= maxLanes){ overflow++; return; }
      laneIdx = lanes.length;
      lanes.push([]);
    }
    lanes[laneIdx].push({ startIdx: item.startIdx, endIdx: item.endIdx });
    placed.push({ ...item, lane: laneIdx });
  });
  return { placed, laneCount: lanes.length, overflow };
}

function eventBarDots(entry){
  const people = entry.personIds.map(personById).filter(Boolean);
  if(!people.length) return `<span class="dot" style="width:6px;height:6px;background:var(--ink-soft);opacity:.4"></span>`;
  return people.slice(0,3).map(p => `<span class="dot" style="width:6px;height:6px;background:${p.color}"></span>`).join('');
}

function eventBarLabel(entry){
  const people = entry.personIds.map(personById).filter(Boolean);
  const names = people.map(p => p.name).join(', ');
  return names ? `${names}: ${entry.text}` : entry.text;
}

/* ---------------- storage ---------------- */

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function migrateEntry(entry){
  if(entry.start) return entry; // already current format
  let start, end;
  const thisMondayISO = isoFromDateObj(mondayOfWeekContaining(new Date()));
  if(entry.timeframe === 'today'){
    start = todayISO(); end = start;
  } else if(entry.timeframe === 'weekend'){
    const sat = addDaysISO(thisMondayISO, 5);
    start = sat; end = addDaysISO(sat, 1);
  } else if(entry.timeframe === 'nextweek'){
    const nextMon = addDaysISO(thisMondayISO, 7);
    start = nextMon; end = addDaysISO(nextMon, 4);
  } else if(entry.timeframe === 'custom' && entry.customDate){
    start = entry.customDate.start;
    end = entry.customDate.end || start;
  } else {
    start = todayISO(); end = start;
  }
  const { timeframe, customDate, ...rest } = entry;
  return { ...rest, start, end };
}

async function loadState(){
  try{
    const value = localStorage.getItem(STORAGE_KEY);
    if(value){
      const parsed = JSON.parse(value);
      state = {
        people: parsed.people || [],
        entries: (parsed.entries || []).map(migrateEntry)
      };
    }
  }catch(e){
    // no existing data yet, keep defaults
  }
  render();
}

async function saveState(retries = 2){
  for(let attempt = 0; attempt <= retries; attempt++){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if(window.wdwSync) window.wdwSync.localChanged();
      return true;
    }catch(e){
      if(attempt === retries){
        dataStatus = { text: 'Save failed — your last change may not have been saved. Try again.', kind: 'err' };
        render();
        return false;
      }
      await new Promise(resolve => setTimeout(resolve, 400 * (attempt + 1)));
    }
  }
}

function setFriendWarning(msg){

function addPerson(name){
  const trimmed = name.trim();
  if(!trimmed) return;
  const isDup = state.people.some(p => p.name.trim().toLowerCase() === trimmed.toLowerCase());
  if(isDup){
    setFriendWarning('name already exists');
    return;
  }
  setFriendWarning('');
  const color = COLORS[state.people.length % COLORS.length].hex;
  state.people.push({ id: uid(), name: trimmed, color, hidden: false });
  saveState();

  // surgical update: refresh only the roster + chip-row so the add-person
  // input element itself is never destroyed/recreated (keeps mobile keyboards open)
  const rosterEl = document.querySelector('.roster');
  if(rosterEl){
    rosterEl.innerHTML = buildRosterHtml();
    wireRosterEvents(rosterEl);
  }
  const chipRowEl = document.querySelector('.chip-row');
  if(chipRowEl){
    chipRowEl.innerHTML = buildChipRowHtml();
    wireChipRowEvents(chipRowEl);
  }
}

function hidePerson(id){

}

function unhidePerson(id){

function savePersonNameFromInput(id){

  if(input){
    const newName = input.value.trim();
    if(newName){
      const isDup = state.people.some(p => p.id !== id && p.name.trim().toLowerCase() === newName.toLowerCase());

/* ---------------- @mention autocomplete ---------------- */

function closeMentionDropdown(){
  mentionActive = false;
  mentionQuery = '';
  mentionMatches = [];
  mentionHighlightIndex = 0;
}

function buildMentionDropdownHtml(){
  if(!mentionMatches.length) return '';
  return mentionMatches.map((p, i) => `
    <div class="mention-item ${i===mentionHighlightIndex?'highlighted':''}" data-mention-person="${p.id}">
      <span class="dot" style="background:${p.color}"></span>${escapeHtml(p.name)}
    </div>
  `).join('');
}

function renderMentionDropdown(){
  const el = document.getElementById('mention-dropdown');
  if(!el) return;
  el.innerHTML = buildMentionDropdownHtml();
  el.classList.toggle('open', mentionMatches.length > 0);
  el.querySelectorAll('[data-mention-person]').forEach(item => {
    item.addEventListener('mousedown', (ev) => {
      // mousedown (not click) so it fires before the textarea's blur
      ev.preventDefault();
      selectMention(item.getAttribute('data-mention-person'));
    });
  });
}

function updateMentionState(textEl){
  if(!textEl) return;
  const cursorPos = textEl.selectionStart;
  const textBefore = textEl.value.slice(0, cursorPos);
  const match = textBefore.match(/@([a-zA-Z0-9' -]{0,30})$/);
  if(!match){
    closeMentionDropdown();
    renderMentionDropdown();
    return;
  }
  mentionQuery = match[1];
  mentionAnchorStart = cursorPos - match[0].length;
  mentionAnchorEnd = cursorPos;
  const visiblePeople = sortPeopleByName(state.people.filter(p => !p.hidden));
  mentionMatches = visiblePeople
    .filter(p => !selectedPeopleForEntry.includes(p.id))
    .filter(p => p.name.toLowerCase().startsWith(mentionQuery.toLowerCase()))
    .slice(0, 6);
  mentionActive = mentionMatches.length > 0;
  mentionHighlightIndex = 0;
  renderMentionDropdown();
}

function selectMention(personId){
  const p = personById(personId);
  const textEl = document.getElementById('composer-text');
  if(!p || !textEl) return;

  const before = composerTextValue.slice(0, mentionAnchorStart);
  const after = composerTextValue.slice(mentionAnchorEnd);
  composerTextValue = before + after;
  textEl.value = composerTextValue;
  const newCursorPos = before.length;
  textEl.setSelectionRange(newCursorPos, newCursorPos);
  textEl.focus();

  if(!selectedPeopleForEntry.includes(personId)) selectedPeopleForEntry.push(personId);
  closeMentionDropdown();
  renderMentionDropdown();

  const chipRowEl = document.querySelector('.chip-row');
  if(chipRowEl){
    chipRowEl.innerHTML = buildChipRowHtml();
    wireChipRowEvents(chipRowEl);
  }
  if(composerWarning){ composerWarning = ''; }
}

function addEntry(){
  const textEl = document.getElementById('composer-text');
  if(textEl) composerTextValue = textEl.value;
  const text = composerTextValue.trim();
  if(!text) return;
  if(!customDateStart) return;
  if(selectedPeopleForEntry.length === 0){
    composerWarning = 'add name';
    render();
    return;
  }

  const start = customDateStart;
  const end = customDateMode === 'range' ? (customDateEnd || customDateStart) : customDateStart;
  const wasEditing = !!editingEntryId;

  if(editingEntryId){
    const entry = state.entries.find(e => e.id === editingEntryId);
    if(entry){
      entry.personIds = [...selectedPeopleForEntry];
      entry.text = text;
      entry.start = start;
      entry.end = end;
    }
  } else {
    state.entries.unshift({
      id: uid(),
      personIds: [...selectedPeopleForEntry],
      text,
      start,
      end,
      createdAt: Date.now(),
      done: false
    });
  }

  resetComposer();
  saveState();

  if(!wasEditing){
    showAddedConfirmation();
  }

  render();
}

function showAddedConfirmation(){
  addedConfirmationVisible = true;
  if(addedConfirmationTimer) clearTimeout(addedConfirmationTimer);
  addedConfirmationTimer = setTimeout(()=>{
    addedConfirmationVisible = false;
    addedConfirmationTimer = null;
    const el = document.getElementById('composer-status');
    if(el && el.classList.contains('ok')){
      el.textContent = '';
      el.classList.remove('ok');
    }
  }, 2000);
}

function startEditEntry(id){
  const entry = state.entries.find(e => e.id === id);
  if(!entry) return;
  editingEntryId = id;
  composerTextValue = entry.text;
  selectedPeopleForEntry = [...entry.personIds];
  customDateStart = entry.start;
  customDateEnd = entry.end || entry.start;
  customDateMode = (entry.end && entry.end !== entry.start) ? 'range' : 'single';
  closeMentionDropdown();
  render();
  const composerEl = document.querySelector('.composer');
  if(composerEl) composerEl.scrollIntoView({ behavior:'smooth', block:'start' });
}

function cancelEdit(){
  resetComposer();
  render();
}

function restoreEntry(id){
  const e = state.entries.find(e => e.id === id);
  if(e) e.done = false;
  saveState();
  render();
}

function deleteEntry(id){
  state.entries = state.entries.filter(e => e.id !== id);
  saveState();
  render();
}

/* ---------------- export / import ---------------- */

function exportData(){
  try{
    const payload = { exportedAt: new Date().toISOString(), app: 'whos-doing-what', state };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const pad = n => String(n).padStart(2,'0');
    const d = new Date();
    const stamp = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const a = document.createElement('a');
    a.href = url;
    a.download = `whos-doing-what-export-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    dataStatus = { text: 'Exported. File downloaded.', kind: 'ok' };
    render();
  }catch(e){
    dataStatus = { text: 'Export failed: ' + e.message, kind: 'err' };
    render();
  }
}

function triggerImportPicker(){
  const input = document.getElementById('import-file-input');
  if(input) input.click();
}

function handleImportFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const incoming = parsed && parsed.state ? parsed.state : parsed;
      if(!incoming || !Array.isArray(incoming.people) || !Array.isArray(incoming.entries)){
        throw new Error('File does not look like a valid export.');
      }
      const migratedEntries = incoming.entries.map(migrateEntry);
      const currentCount = state.people.length + state.entries.length;
      if(currentCount > 0){
        const proceed = confirm(`This will replace your current data (${state.people.length} people, ${state.entries.length} entries) with the imported file (${incoming.people.length} people, ${migratedEntries.length} entries). Continue?`);
        if(!proceed) return;
      }
      state = { people: incoming.people, entries: migratedEntries };
      saveState();
      dataStatus = { text: `Imported ${incoming.people.length} people, ${migratedEntries.length} entries.`, kind: 'ok' };
      render();
    }catch(e){
      dataStatus = { text: 'Import failed: ' + e.message, kind: 'err' };
      render();
    }
  };
  reader.onerror = () => {
    dataStatus = { text: 'Could not read that file.', kind: 'err' };
    render();
  };
  reader.readAsText(file);
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- render ---------------- */

function sortPeopleByName(people){
  return [...people].sort((a,b) => a.name.localeCompare(b.name, undefined, { sensitivity:'base' }));
}

function buildRosterHtml(){
  const visiblePeople = sortPeopleByName(state.people.filter(p => !p.hidden));
  return visiblePeople.length
    ? visiblePeople.map(p => {
        if(editingPersonId === p.id){
          return `
            <div class="nametag editing">
              <span class="dot" style="background:${p.color}"></span>
              <input class="nametag-edit-input" id="person-edit-${p.id}" type="text" value="${escapeHtml(p.name)}" />
            </div>
          `;
        }
        return `
          <div class="nametag ${filterPersonId===p.id?'active':''}" data-person="${p.id}">
            <span class="dot" style="background:${p.color}"></span>
            <span class="nametag-name">${escapeHtml(p.name)}</span>
            <span class="edit" data-edit-person="${p.id}">✎</span>
            <span class="hide" data-hide-person="${p.id}" title="Hide friend"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg></span>
          </div>
        `;
      }).join('')
    : `<div class="filter-hint">Add a friend below to get started.</div>`;
}

function buildChipRowHtml(){
  const visiblePeople = sortPeopleByName(state.people.filter(p => !p.hidden));
  return visiblePeople.length
    ? visiblePeople.map(p => `
        <div class="pick-chip ${selectedPeopleForEntry.includes(p.id)?'selected':''}" data-pick="${p.id}">
          <span class="dot" style="background:${p.color}"></span>${escapeHtml(p.name)}
        </div>
      `).join('')
    : `<div class="empty-roster-note">No one added yet — add a name in the sidebar first.</div>`;
}

function buildHiddenFriendsHtml(){
  const hiddenPeople = sortPeopleByName(state.people.filter(p => p.hidden));
  return hiddenPeople.length
    ? hiddenPeople.map(p => `
        <div class="nametag hidden-friend">
          <span class="dot" style="background:${p.color}"></span>
          <span class="nametag-name">${escapeHtml(p.name)}</span>
          <span class="unhide" data-unhide-person="${p.id}" title="Unhide friend">👁</span>
        </div>
      `).join('')
    : `<div class="filter-hint">No hidden friends.</div>`;
}

function wireRosterEvents(scopeEl){
  if(!scopeEl) return;
  scopeEl.querySelectorAll('[data-person]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      if(ev.target.closest('[data-hide-person]') || ev.target.closest('[data-edit-person]')) return;
      toggleFilter(el.getAttribute('data-person'));
    });
  });
  scopeEl.querySelectorAll('[data-hide-person]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      hidePerson(el.getAttribute('data-hide-person'));
    });
  });
  scopeEl.querySelectorAll('[data-edit-person]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      startEditPerson(el.getAttribute('data-edit-person'));
    });
  });
  if(editingPersonId){
    const input = document.getElementById(`person-edit-${editingPersonId}`);
    if(input){
      input.addEventListener('keydown', (ev)=>{
        if(ev.key === 'Enter'){ ev.preventDefault(); savePersonNameFromInput(editingPersonId); }
        else if(ev.key === 'Escape'){ ev.preventDefault(); cancelEditPerson(); }
      });
      input.addEventListener('blur', ()=>{
        if(editingPersonId) savePersonNameFromInput(editingPersonId);
      });
    }
  }
}

function wireChipRowEvents(scopeEl){
  if(!scopeEl) return;
  scopeEl.querySelectorAll('[data-pick]').forEach(el=>{
    el.addEventListener('click', ()=> toggleEntryPerson(el.getAttribute('data-pick')));
  });
}

function wireHiddenFriendsEvents(scopeEl){
  if(!scopeEl) return;
  scopeEl.querySelectorAll('[data-unhide-person]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      unhidePerson(el.getAttribute('data-unhide-person'));
    });
  });
}

function cardHtml(e){
  const people = e.personIds.map(personById).filter(Boolean);
  const peopleHtml = people.length
    ? people.map(p => `<span class="mini-tag"><span class="dot" style="background:${p.color}"></span>${escapeHtml(p.name)}</span>`).join('')
    : `<span class="mini-tag" style="opacity:.5">no one tagged</span>`;
  const dateLabel = formatDateRange(e.start, e.end);
  return `
    <div class="card" data-entry="${e.id}">
      <div class="card-people">${peopleHtml}</div>
      ${dateLabel ? `<div class="card-date">${escapeHtml(dateLabel)}</div>` : ''}
      <p class="card-text">${escapeHtml(e.text)}</p>
      <div class="card-actions">
        <span data-delentry="${e.id}">delete</span>
      </div>
    </div>
  `;
}

function entryHasHiddenPerson(e){
  return e.personIds.some(pid => {
    const p = personById(pid);
    return p && p.hidden;
  });
}

function getActiveEntries(){
  const visibleEntries = filterPersonId
    ? state.entries.filter(e => e.personIds.includes(filterPersonId))
    : state.entries;
  return visibleEntries.filter(e => !e.done && !entryHasHiddenPerson(e));
}

function buildEntrySearchDateString(entry){
  const startDt = parseISO(entry.start);
  const endDt = parseISO(entry.end || entry.start);
  return [
    entry.start,
    entry.end || entry.start,
    formatMD(entry.start),
    formatMD(entry.end || entry.start),
    startDt.toLocaleDateString(undefined, { weekday:'long' }),
    startDt.toLocaleDateString(undefined, { month:'long' }),
    endDt.toLocaleDateString(undefined, { weekday:'long' }),
    endDt.toLocaleDateString(undefined, { month:'long' })
  ].join(' ').toLowerCase();
}

function entryMatchesSearch(entry, query){
  const q = query.trim().toLowerCase();
  if(!q) return true;
  const names = entry.personIds.map(personById).filter(Boolean).map(p => p.name.toLowerCase());
  if(names.some(n => n.includes(q))) return true;
  if(entry.text.toLowerCase().includes(q)) return true;
  if(buildEntrySearchDateString(entry).includes(q)) return true;
  return false;
}

function getKanbanSearchedEntries(){
  const active = getActiveEntries();
  return kanbanSearchQuery.trim() ? active.filter(e => entryMatchesSearch(e, kanbanSearchQuery)) : active;
}

function buildKanbanRowHtml(period, activeEntries){
  const items = activeEntries.filter(e => e.start <= period.end && (e.end || e.start) >= period.start)
    .sort((a,b) => a.start.localeCompare(b.start));
  return `
    <div class="kanban-row">
      <div class="kanban-row-label">${escapeHtml(period.label)}</div>
      <div class="kanban-row-cards">
        ${items.length ? items.map(cardHtml).join('') : `<div class="empty-col">nothing here yet</div>`}
      </div>
    </div>
  `;
}

function wireEntryCardEvents(scopeEl){
  if(!scopeEl) return;
  scopeEl.querySelectorAll('[data-delentry]').forEach(el=>{
    el.addEventListener('click', (ev)=>{ ev.stopPropagation(); deleteEntry(el.getAttribute('data-delentry')); });
  });
  scopeEl.querySelectorAll('[data-entry]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      if(ev.target.closest('.card-actions') || ev.target.closest('.acts')) return;
      startEditEntry(el.getAttribute('data-entry'));
    });
  });
}

function render(){
  const app = document.getElementById('app');

  const visibleEntries = filterPersonId
    ? state.entries.filter(e => e.personIds.includes(filterPersonId))
    : state.entries;

  const activeEntries = visibleEntries.filter(e => !e.done && !entryHasHiddenPerson(e));
  const doneEntries = visibleEntries.filter(e => e.done && !entryHasHiddenPerson(e)).sort((a,b)=>b.createdAt-a.createdAt);

  const rosterHtml = buildRosterHtml();
  const chipRowHtml = buildChipRowHtml();

  const quickPeriods = getQuickPeriods();
  const quickChipsHtml = quickPeriods.map(p => `
    <div class="quick-chip" data-quick-start="${p.start}" data-quick-end="${p.end}">${p.label}</div>
  `).join('');

  const datePickerHtml = `
    <div class="date-picker">
      <div class="quick-chip-row">${quickChipsHtml}</div>
      <div class="date-mode-row">
        <div class="date-mode-btn ${customDateMode==='single'?'selected':''}" data-datemode="single">Single date</div>
        <div class="date-mode-btn ${customDateMode==='range'?'selected':''}" data-datemode="range">Date range</div>
      </div>
      <div class="date-input-row">
        <input type="date" id="custom-date-start" value="${customDateStart}" />
        ${customDateMode === 'range' ? `<span class="to-label">to</span><input type="date" id="custom-date-end" value="${customDateEnd}" min="${customDateStart || ''}" />` : ''}
      </div>
    </div>
  `;

  const addDisabled = !customDateStart;

  // ---- Kanban ----
  const kanbanPeriods = generateKanbanPeriods(kanbanPeriodsCount);
  const kanbanSearchedEntries = kanbanSearchQuery.trim()
    ? activeEntries.filter(e => entryMatchesSearch(e, kanbanSearchQuery))
    : activeEntries;
  const kanbanRowsHtml = kanbanPeriods.map(period => buildKanbanRowHtml(period, kanbanSearchedEntries)).join('');

  // ---- Done list ----
  const doneHtml = doneEntries.map(e => {
    const people = e.personIds.map(personById).filter(Boolean).map(p=>p.name).join(', ');
    const dateLabel = formatDateRange(e.start, e.end);
    const prefix = [people, dateLabel].filter(Boolean).join(' · ');
    return `
      <div class="done-card" data-entry="${e.id}">
        <span class="txt">${prefix ? escapeHtml(prefix) + ' — ' : ''}${escapeHtml(e.text)}</span>
        <span class="acts">
          <span data-restore="${e.id}">restore</span>
          <span data-delentry="${e.id}">delete</span>
        </span>
      </div>
    `;
  }).join('');

  // ---- Calendar ----
  function weekRowHtml(weekStartIso, maxLanes, dimMonth){
    const todayIso = todayISO();
    const days = [];
    for(let i=0;i<7;i++) days.push(addDaysISO(weekStartIso, i));
    const { placed, laneCount, overflow } = computeWeekLayout(weekStartIso, activeEntries, maxLanes);

    const daynumsHtml = days.map(iso => {
      const dayNum = parseInt(iso.split('-')[2], 10);
      const dim = (dimMonth !== null) ? (parseISO(iso).getMonth() !== dimMonth) : false;
      const isToday = iso === todayIso;
      return `<div class="cal-daynum-cell ${isToday?'today':''} ${dim?'other-month':''}">${dayNum}</div>`;
    }).join('');

    const barsHtml = placed.map(({entry, startIdx, endIdx, lane}) => `
      <div class="cal-bar" data-entry="${entry.id}" style="grid-column:${startIdx+1} / ${endIdx+2}; grid-row:${lane+1};">
        <span class="cal-bar-dots">${eventBarDots(entry)}</span><span class="cal-bar-text">${escapeHtml(eventBarLabel(entry))}</span>
      </div>
    `).join('');

    return `
      <div class="cal-week-row">
        <div class="cal-daynums">${daynumsHtml}</div>
        <div class="cal-bars" style="grid-template-rows:repeat(${Math.max(laneCount,1)}, 20px);">${barsHtml}</div>
        ${overflow > 0 ? `<div class="cal-more">+${overflow} more</div>` : ''}
      </div>
    `;
  }

  function calendarBodyHtml(){
    const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    let headerLabel, weeksHtml;

    if(calendarView === 'week'){
      const weekStart = mondayOfWeekISO(calendarAnchor);
      headerLabel = formatWeekRangeLabel(weekStart);
      weeksHtml = weekRowHtml(weekStart, 8, null);
    } else {
      const dt = parseISO(calendarAnchor);
      const currentMonth = dt.getMonth();
      headerLabel = formatMonthYear(calendarAnchor);
      const firstOfMonth = new Date(dt.getFullYear(), currentMonth, 1);
      const firstMonday = isoFromDateObj(mondayOfWeekContaining(firstOfMonth));
      const rows = [];
      for(let w=0; w<6; w++){
        rows.push(weekRowHtml(addDaysISO(firstMonday, w*7), 3, currentMonth));
      }
      weeksHtml = rows.join('');
    }

    return `
      <div class="calendar-body">
        <div class="calendar-controls">
          <div class="calendar-nav">
            <span class="cal-nav-btn" id="cal-prev">‹</span>
            <span class="cal-label">${headerLabel}</span>
            <span class="cal-nav-btn" id="cal-next">›</span>
            <span class="cal-today-btn" id="cal-today">Today</span>
          </div>
          <div class="view-toggle">
            <div class="view-toggle-btn ${calendarView==='week'?'selected':''}" data-calview="week">Week</div>
            <div class="view-toggle-btn ${calendarView==='month'?'selected':''}" data-calview="month">Month</div>
          </div>
        </div>
        <div class="cal-daynames">${dayNames.map(n=>`<div class="cal-dayname">${n}</div>`).join('')}</div>
        ${weeksHtml}
      </div>
    `;
  }

  app.innerHTML = `
    <div class="layout">
      <div>
        <div class="roster-title">Friends</div>
        <div class="roster">${rosterHtml}</div>
        <div class="add-person">
          <input id="new-person-input" type="text" placeholder="Add a name…" />
          <button id="add-person-btn">＋</button>
        </div>
        <div class="friend-warning" id="friend-warning">${friendWarning ? escapeHtml(friendWarning) : ''}</div>
        ${filterPersonId ? `<div class="filter-hint">Showing only ${escapeHtml(personById(filterPersonId)?.name || '')}. <span class="clear-filter" id="clear-filter">Clear</span></div>` : `<div class="filter-hint">Tap a name to see just their stuff.</div>`}

        <div class="roster-title" style="margin-top:22px;">Data</div>
        <div class="data-tools">
          <button id="export-data-btn" type="button">Export</button>
          <button id="import-data-btn" type="button">Import</button>
        </div>
        <input type="file" id="import-file-input" accept="application/json" style="display:none;" />
        ${dataStatus.text ? `<div class="data-status ${dataStatus.kind}">${escapeHtml(dataStatus.text)}</div>` : ''}
        ${window.wdwSync ? window.wdwSync.html() : ''}

        <div class="roster-title-toggle" id="hidden-friends-toggle" style="margin-top:22px;">
          <span class="section-chevron">${hiddenFriendsCollapsed ? '▸' : '▾'}</span>
          <span class="roster-title">Hidden Friends (${state.people.filter(p=>p.hidden).length})</span>
        </div>
        ${hiddenFriendsCollapsed ? '' : `<div class="roster" style="margin-top:8px;">${buildHiddenFriendsHtml()}</div>`}
      </div>

      <div>
        <div class="composer">
          <div class="composer-label" style="display:flex;justify-content:space-between;align-items:center;">
            <span>${editingEntryId ? 'Editing entry' : "Who's this about?"}</span>
            ${editingEntryId ? `<span class="cancel-edit-link" id="cancel-edit-btn">Cancel</span>` : ''}
          </div>
          <div class="chip-row">${chipRowHtml}</div>
          <div class="composer-text-wrap">
            <textarea id="composer-text" rows="2" placeholder="e.g. hiking Sat morning with @Alex">${escapeHtml(composerTextValue)}</textarea>
            <div class="mention-dropdown ${mentionMatches.length ? 'open' : ''}" id="mention-dropdown">${buildMentionDropdownHtml()}</div>
          </div>
          ${datePickerHtml}
          <div class="composer-footer">
            <span class="composer-status ${composerWarning ? 'warn' : (addedConfirmationVisible ? 'ok' : '')}" id="composer-status">${composerWarning ? escapeHtml(composerWarning) : (addedConfirmationVisible ? 'added!' : '')}</span>
            <button class="add-entry-btn" id="add-entry-btn" ${addDisabled ? 'disabled' : ''}>${editingEntryId ? 'Save changes' : 'Add'}</button>
          </div>
        </div>

        <div class="section-header" id="kanban-toggle">
          <div class="section-header-left">
            <span class="section-chevron">${kanbanCollapsed ? '▸' : '▾'}</span>
            <span class="section-title">Kanban</span>
          </div>
          <span class="section-sub">scroll for more</span>
        </div>
        ${kanbanCollapsed ? '' : `
          <div class="kanban-search-row">
            <input type="text" id="kanban-search" placeholder="Search friends, events, dates…" value="${escapeHtml(kanbanSearchQuery)}" />
            ${kanbanSearchQuery ? `<span class="kanban-search-clear" id="kanban-search-clear">✕</span>` : ''}
          </div>
          <div class="kanban-scroll">
            ${kanbanRowsHtml}
            <div class="kanban-sentinel" id="kanban-sentinel"></div>
          </div>
        `}

        <div class="section-header" id="calendar-toggle">
          <div class="section-header-left">
            <span class="section-chevron">${calendarCollapsed ? '▸' : '▾'}</span>
            <span class="section-title">Calendar</span>
          </div>
        </div>
        ${calendarCollapsed ? '' : calendarBodyHtml()}

        <div class="done-section">
          <div class="done-toggle" id="toggle-done">${showDone ? '▾' : '▸'} done (${doneEntries.length})</div>
          ${showDone ? `<div class="done-list">${doneEntries.length ? doneHtml : '<div class="empty-col">nothing marked done yet</div>'}</div>` : ''}
        </div>
      </div>
    </div>
  `;

  wireEvents();

  if(pendingFocusId){
    const el = document.getElementById(pendingFocusId);
    if(el){
      el.focus();
      if(el.select) el.select();
    }
    pendingFocusId = null;
  }

  setupKanbanInfiniteScroll();
}

function formatMonthYear(iso){
  return parseISO(iso).toLocaleDateString(undefined, { month:'long', year:'numeric' });
}

function formatWeekRangeLabel(weekStartIso){
  const startDt = parseISO(weekStartIso);
  const endIso = addDaysISO(weekStartIso, 6);
  const endDt = parseISO(endIso);
  const sameMonth = startDt.getMonth() === endDt.getMonth();
  const startLabel = startDt.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  const endLabel = endDt.toLocaleDateString(undefined, sameMonth ? { day:'numeric' } : { month:'short', day:'numeric' });
  return `${startLabel} – ${endLabel}, ${endDt.getFullYear()}`;
}

function setupKanbanInfiniteScroll(){
  if(kanbanObserver){ kanbanObserver.disconnect(); kanbanObserver = null; }
  if(kanbanCollapsed) return;
  const scrollEl = document.querySelector('.kanban-scroll');
  const sentinel = document.getElementById('kanban-sentinel');
  if(!scrollEl || !sentinel) return;
  kanbanObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(!entry.isIntersecting || kanbanPeriodsCount >= KANBAN_MAX_PERIODS) return;

      const oldCount = kanbanPeriodsCount;
      const newCount = Math.min(KANBAN_MAX_PERIODS, oldCount + 6);
      if(newCount === oldCount) return;

      // append only the newly-generated rows directly into the existing scroll
      // container (never rebuild/replace it) so an in-progress scroll/trackpad
      // gesture never loses the DOM node it's targeting
      const newPeriods = generateKanbanPeriods(newCount).slice(oldCount);
      const activeEntries = getKanbanSearchedEntries();
      const newRowsHtml = newPeriods.map(p => buildKanbanRowHtml(p, activeEntries)).join('');
      const liveSentinel = document.getElementById('kanban-sentinel');
      if(liveSentinel){
        liveSentinel.insertAdjacentHTML('beforebegin', newRowsHtml);
        wireEntryCardEvents(document.querySelector('.kanban-scroll'));
      }
      kanbanPeriodsCount = newCount;

      if(kanbanPeriodsCount >= KANBAN_MAX_PERIODS && kanbanObserver){
        kanbanObserver.disconnect();
      }
    });
  }, { root: scrollEl, threshold: 0.1 });
  kanbanObserver.observe(sentinel);
}

function updateKanbanSearch(query){
  kanbanSearchQuery = query;
  const scrollEl = document.querySelector('.kanban-scroll');
  if(!scrollEl) return;
  const searched = getKanbanSearchedEntries();
  const periods = generateKanbanPeriods(kanbanPeriodsCount);
  const rowsHtml = periods.map(p => buildKanbanRowHtml(p, searched)).join('');
  scrollEl.innerHTML = rowsHtml + '<div class="kanban-sentinel" id="kanban-sentinel"></div>';
  scrollEl.scrollTop = 0;
  wireEntryCardEvents(scrollEl);
  setupKanbanInfiniteScroll();

  const searchRow = document.querySelector('.kanban-search-row');
  if(searchRow){
    const existingClear = document.getElementById('kanban-search-clear');
    if(query && !existingClear){
      const span = document.createElement('span');
      span.className = 'kanban-search-clear';
      span.id = 'kanban-search-clear';
      span.textContent = '✕';
      span.addEventListener('click', ()=>{
        const input = document.getElementById('kanban-search');
        if(input) input.value = '';
        updateKanbanSearch('');
        if(input) input.focus();
      });
      searchRow.appendChild(span);
    } else if(!query && existingClear){
      existingClear.remove();
    }
  }
}

/* ---------------- events ---------------- */

function wireEvents(){
  const app = document.getElementById('app');

  wireRosterEvents(app);
  wireChipRowEvents(app);

  app.querySelectorAll('[data-datemode]').forEach(el=>{
    el.addEventListener('click', ()=>{ customDateMode = el.getAttribute('data-datemode'); render(); });
  });
  app.querySelectorAll('[data-quick-start]').forEach(el=>{
    el.addEventListener('click', ()=>{
      customDateMode = 'range';
      customDateStart = el.getAttribute('data-quick-start');
      customDateEnd = el.getAttribute('data-quick-end');
      render();
    });
  });
  const startDateInput = document.getElementById('custom-date-start');
  if(startDateInput){
    startDateInput.addEventListener('change', ()=>{
      customDateStart = startDateInput.value;
      render();
    });
  }
  const endDateInput = document.getElementById('custom-date-end');
  if(endDateInput){
    endDateInput.addEventListener('change', ()=>{
      customDateEnd = endDateInput.value;
      render();
    });
  }

  wireEntryCardEvents(app);
  app.querySelectorAll('[data-restore]').forEach(el=>{
    el.addEventListener('click', (ev)=>{ ev.stopPropagation(); restoreEntry(el.getAttribute('data-restore')); });
  });

  const addBtn = document.getElementById('add-entry-btn');
  if(addBtn) addBtn.addEventListener('click', addEntry);

  const cancelEditBtn = document.getElementById('cancel-edit-btn');
  if(cancelEditBtn) cancelEditBtn.addEventListener('click', cancelEdit);

  const composerText = document.getElementById('composer-text');
  if(composerText){
    composerText.addEventListener('input', ()=>{
      composerTextValue = composerText.value;
      updateMentionState(composerText);
    });
    composerText.addEventListener('click', ()=> updateMentionState(composerText));
    composerText.addEventListener('keyup', (ev)=>{
      if(['ArrowLeft','ArrowRight','Home','End'].includes(ev.key)) updateMentionState(composerText);
    });
    composerText.addEventListener('keydown', (ev)=>{
      if(mentionActive && mentionMatches.length){
        if(ev.key === 'ArrowDown'){
          ev.preventDefault();
          mentionHighlightIndex = (mentionHighlightIndex + 1) % mentionMatches.length;
          renderMentionDropdown();
          return;
        }
        if(ev.key === 'ArrowUp'){
          ev.preventDefault();
          mentionHighlightIndex = (mentionHighlightIndex - 1 + mentionMatches.length) % mentionMatches.length;
          renderMentionDropdown();
          return;
        }
        if(ev.key === 'Enter' || ev.key === 'Tab'){
          ev.preventDefault();
          selectMention(mentionMatches[mentionHighlightIndex].id);
          return;
        }
        if(ev.key === 'Escape'){
          ev.preventDefault();
          closeMentionDropdown();
          renderMentionDropdown();
          return;
        }
      }
      if(ev.key === 'Enter' && !ev.shiftKey){
        ev.preventDefault();
        addEntry();
      }
    });
    composerText.addEventListener('blur', ()=>{
      // small delay so a mousedown on a dropdown item still registers first
      setTimeout(()=>{ closeMentionDropdown(); renderMentionDropdown(); }, 150);
    });
  }

  function submitNewPerson(){
    const input = document.getElementById('new-person-input');
    if(!input) return;
    const value = input.value;
    if(!value.trim()) return;
    const before = state.people.length;
    addPerson(value);
    if(state.people.length > before) input.value = '';
  }
  const addPersonBtn = document.getElementById('add-person-btn');
  const newPersonInput = document.getElementById('new-person-input');
  if(addPersonBtn) addPersonBtn.addEventListener('click', submitNewPerson);
  if(newPersonInput){
    newPersonInput.addEventListener('input', ()=>{
      if(friendWarning) setFriendWarning('');
    });
    newPersonInput.addEventListener('keydown', (ev)=>{
      if(ev.key === 'Enter'){
        ev.preventDefault();
        submitNewPerson();
      }
    });
  }

  const clearFilter = document.getElementById('clear-filter');
  if(clearFilter) clearFilter.addEventListener('click', ()=>{ filterPersonId=null; render(); });

  const exportBtn = document.getElementById('export-data-btn');
  if(exportBtn) exportBtn.addEventListener('click', exportData);
  const importBtn = document.getElementById('import-data-btn');
  if(importBtn) importBtn.addEventListener('click', triggerImportPicker);
  const importFileInput = document.getElementById('import-file-input');
  if(importFileInput){
    importFileInput.addEventListener('change', (ev)=>{
      const file = ev.target.files && ev.target.files[0];
      handleImportFile(file);
      importFileInput.value = '';
    });
  }

  const toggleDone = document.getElementById('toggle-done');
  if(toggleDone) toggleDone.addEventListener('click', ()=>{ showDone = !showDone; render(); });

  const kanbanToggle = document.getElementById('kanban-toggle');
  if(kanbanToggle) kanbanToggle.addEventListener('click', ()=>{ kanbanCollapsed = !kanbanCollapsed; render(); });

  const kanbanSearchInput = document.getElementById('kanban-search');
  if(kanbanSearchInput){
    kanbanSearchInput.addEventListener('input', ()=>{
      updateKanbanSearch(kanbanSearchInput.value);
    });
  }
  const kanbanSearchClear = document.getElementById('kanban-search-clear');
  if(kanbanSearchClear){
    kanbanSearchClear.addEventListener('click', ()=>{
      const input = document.getElementById('kanban-search');
      if(input) input.value = '';
      updateKanbanSearch('');
      if(input) input.focus();
    });
  }

  const calendarToggle = document.getElementById('calendar-toggle');
  if(calendarToggle) calendarToggle.addEventListener('click', ()=>{ calendarCollapsed = !calendarCollapsed; render(); });

  const hiddenFriendsToggle = document.getElementById('hidden-friends-toggle');
  if(hiddenFriendsToggle) hiddenFriendsToggle.addEventListener('click', ()=>{ hiddenFriendsCollapsed = !hiddenFriendsCollapsed; render(); });
  wireHiddenFriendsEvents(app);

  app.querySelectorAll('[data-calview]').forEach(el=>{
    el.addEventListener('click', ()=>{ calendarView = el.getAttribute('data-calview'); render(); });
  });
  const calPrev = document.getElementById('cal-prev');
  if(calPrev){
    calPrev.addEventListener('click', ()=>{
      if(calendarView === 'week'){
        calendarAnchor = addDaysISO(calendarAnchor, -7);
      } else {
        const dt = parseISO(calendarAnchor);
        calendarAnchor = isoFromDateObj(new Date(dt.getFullYear(), dt.getMonth()-1, 1));
      }
      render();
    });
  }
  const calNext = document.getElementById('cal-next');
  if(calNext){
    calNext.addEventListener('click', ()=>{
      if(calendarView === 'week'){
        calendarAnchor = addDaysISO(calendarAnchor, 7);
      } else {
        const dt = parseISO(calendarAnchor);
        calendarAnchor = isoFromDateObj(new Date(dt.getFullYear(), dt.getMonth()+1, 1));
      }
      render();
    });
  }
  const calToday = document.getElementById('cal-today');
  if(calToday) calToday.addEventListener('click', ()=>{ calendarAnchor = todayISO(); render(); });
}

// iOS Safari ignores user-scalable=no for pinch gestures; block them explicitly.
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));

// Hooks used by the optional sync module (sync.js).
window.wdwApp = {
  getState: () => state,
  applyRemote: (s) => {
    state = { people: s.people || [], entries: (s.entries || []).map(migrateEntry) };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  },
  render: () => render(),
};

loadState();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
